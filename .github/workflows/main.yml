name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby 4.0.7

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler: "4.0.23"
      - name: Install dependencies, install example gems, and run tests
        run: |
          bundle install

          for dir in examples/*/; do
            if [ -f "$dir/bin/boxwerk" ]; then
              echo "==> Installing gems for $dir"
              (cd "$dir" && bin/boxwerk install)
            fi
          done

          RUBY_BOX=1 bundle exec rake
